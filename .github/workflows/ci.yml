# Mirrors Render: type-check + production compile, plus Docker images.
#
# Branch protection should require exactly:
#   "Lint, type-check, test, build"
# That check is the gate job below — it stays red unless BOTH unit checks AND
# Docker (api + web) succeed. That way Render Dockerfile `tsc` failures (e.g.
# branded UUID assignability) cannot be bypassed by a lint-only unit failure.

name: CI

permissions:
  contents: read
  actions: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: ContractorAI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same compile sequence as Dockerfile / Render API image — run before lint
      # so a missing eslint binary cannot hide production tsc failures.
      - name: Backend production compile (Docker parity)
        run: |
          pnpm --filter @contractor/shared build
          pnpm --filter @contractor/ai-actions build
          pnpm --filter @contractor/backend build

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Lint backend
        run: pnpm --filter @contractor/backend lint

  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: Dockerfile
          - name: web
            file: Dockerfile.web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Keep this job name stable — it is the required status check on main.
  gate:
    name: Lint, type-check, test, build
    needs: [unit, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require unit checks and Docker image builds
        run: |
          unit="${{ needs.unit.result }}"
          docker="${{ needs.docker.result }}"
          echo "unit=$unit"
          echo "docker=$docker"
          if [ "$unit" != "success" ] || [ "$docker" != "success" ]; then
            echo "::error::CI gate failed (unit=$unit docker=$docker). Docker (api) must pass — that is the Render API image build."
            exit 1
          fi
